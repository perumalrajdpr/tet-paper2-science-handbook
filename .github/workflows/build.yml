name: Build TET Handbook

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts (DejaVu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build all available chapters
        run: python build/build_all.py

      - name: Combine into master handbook
        run: python build/combine.py

      - name: Upload PDFs as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TET-Handbook-PDFs
          path: output/
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/TET_Handbook_Paper2_Science_Master.pdf
          body: |
            ## TN-TET Paper II Science Handbook
            Built automatically from source.
            **ChalkPieceDiary** | chalkpiecediary.com
